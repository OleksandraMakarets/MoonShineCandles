{% extends "base.html" %}
{% load static %}

{% block page_header %}
    <div class="container header-container">
        <div class="row">
            <div class="col"></div>
        </div>
    </div>
{% endblock %}

{% block content %}
    <div class="overlay"></div>
    <div class="container">
        <div class="review-section">
            <div class="row">
                <div class="col-12">
                    <hr>
                    <h2 class="logo-font mb-4">Add a Review</h2>
                    <h5 class="text-muted">Share your experience about {{ product.name }}</h5>
                    <hr>
                </div>
            </div>

            <div class="row">
                <div class="col-12 col-md-8">
                    <form method="POST" action="{% url 'add_review' product.id %}" class="review-form mb-4">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="form-group">
                                {{ field.label_tag }}
                                {{ field|as_crispy_field }}
                            </div>
                        {% endfor %}
                        <div class="text-right">
                            <a class="btn btn-outline-black rounded-0" href="{% url 'product_detail' product.id %}">Cancel</a>
                            <button class="btn btn-black rounded-0" type="submit">Submit Review</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
